<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Nomeações - Concurso TJPE</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #fff; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .status-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .badge-none { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid var(--border); }
    .badge-alert { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .meta-date { font-size: 0.85rem; color: var(--text-muted); }
    
    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-blue);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .trecho {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Monitor de Nomeações • TJPE</h1>
      <p>Varredura diária automática no Caderno Administrativo do DJe</p>
    </header>

    <div class="status-panel">
      <div id="badgeStatus" class="badge badge-none">Carregando dados...</div>
      <p id="msgPrincipal" style="font-size: 1.05rem; margin-bottom: 0.75rem;"></p>
      <div class="meta-date" id="dataVerificacao"></div>
    </div>

    <div id="listaOcorrencias"></div>
  </div>

  <script>
    async function carregarStatus() {
      try {
        // Busca com timestamp para evitar cache no navegador
        const res = await fetch(`status.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error("status.json ainda não criado.");
        
        const data = await res.json();

        const badge = document.getElementById("badgeStatus");
        const msg = document.getElementById("msgPrincipal");
        const dataVerif = document.getElementById("dataVerificacao");
        const lista = document.getElementById("listaOcorrencias");

        dataVerif.textContent = `Última verificação: ${data.ultima_verificacao} | Edição: ${data.data_diario}`;
        msg.textContent = data.mensagem;

        if (data.encontrou_mencoes) {
          badge.className = "badge badge-alert";
          badge.textContent = `🚨 ${data.total_ocorrencias} PUBLICAÇÃO(ÕES) ENCONTRADA(S)`;

          data.ocorrencias.forEach(item => {
            const div = document.createElement("div");
            div.className = "card-item";
            div.innerHTML = `
              <div class="card-item-header">
                <span>Termo: <strong>${item.termo}</strong></span>
                <span>Página: ${item.pagina}</span>
              </div>
              <div class="trecho">${item.trecho}</div>
            `;
            lista.appendChild(div);
          });
        } else {
          badge.className = "badge badge-none";
          badge.textContent = "NENHUMA NOMEAÇÃO HOJE";
        }

      } catch (e) {
        document.getElementById("badgeStatus").textContent = "Aguardando 1ª execução";
        document.getElementById("msgPrincipal").textContent = "Execute a Action no GitHub para gerar a primeira leitura.";
      }
    }

    carregarStatus();
  </script>
</body>
</html>
